kind = "web"
previewPath = "/"
title = "Fitwear - Sports & Fitness"
version = "1.0.0"
id = "artifacts/fitwear"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21061

[services.development]
run = "pnpm --filter @workspace/fitwear run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitwear", "run", "build" ]
publicDir = "artifacts/fitwear/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21061"
BASE_PATH = "/"
